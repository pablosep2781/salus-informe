function sem(vp,isGasto){
  if(vp===null)return'x'
  const bad=isGasto?vp>5:vp<-5
  const crit=isGasto?vp>15:vp<-15
  if(crit)return'r';if(bad)return'a';return'g'
}

function buildResumen(){
  const maxBar=Math.max(...DEPTS.map(d=>Math.max(d.lines.reduce((a,l)=>a+l[1],0),d.lines.reduce((a,l)=>a+l[2],0))))

    {mes:'Febrero',r:PLD.febrero.util_imp.r,p:PLD.febrero.util_imp.p},

  const maxU=Math.max(...trendMeses.map(m=>Math.max(m.r,m.p)))

  return`
  <div class="chart-wrap">
    <div class="chart-title">Presupuesto vs. Ejecutado por área <span style="font-size:11px;color:#94a3b8;font-weight:400">(COP)</span></div>
    <div class="chart-legend">

      <span><span class="leg-dot" style="background:#6366f1"></span><span style="font-size:11px;color:#64748b">Ejecutado</span></span>
    </div>
    ${DEPTS.map(d=>{
      const dp=d.lines.reduce((a,l)=>a+l[1],0)
      const de=d.lines.reduce((a,l)=>a+l[2],0)
      const over=de>dp
      return`<div class="bar-group">
        <div class="bar-label" style="color:${d.color}">${d.name}</div>
        <div class="bar-row"><div class="bar-track"><div class="bar-fill" style="width:${Math.round(dp/maxBar*100)}%;background:#c7d2fe"></div></div><div class="bar-num" style="color:#94a3b8">${fN(dp)}</div></div>
        <div class="bar-row"><div class="bar-track"><div class="bar-fill" style="width:${Math.round(de/maxBar*100)}%;background:${d.color}"></div></div><div class="bar-num" style="color:${over?'#dc2626':'#16a34a'};font-weight:600">${fN(de)} <span style="font-size:10px">${fP(vPct(dp,de))}</span></div></div>
      </div>`
    }).join('')}
  </div>

  <div class="chart-wrap">
    <div class="chart-title">Utilidad antes de impuestos <span style="font-size:11px;color:#94a3b8;font-weight:400">Ene–Mar (millones COP)</span></div>
    <div style="display:flex;gap:10px;align-items:flex-end;height:110px;margin-top:12px;padding:0 8px">
      ${trendMeses.map(m=>{
        const rh=Math.round(m.r/maxU*80),ph=Math.round(m.p/maxU*80)
        const over=m.r<m.p
        return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
          <div style="font-size:11px;font-weight:600;color:${over?'#dc2626':'#4338ca'}">${fM(m.r)}</div>
          <div style="width:100%;display:flex;gap:3px;align-items:flex-end;height:80px">
            <div style="flex:1;height:${ph}px;background:#c7d2fe;border-radius:4px 4px 0 0"></div>
            <div style="flex:1;height:${rh}px;background:${over?'#ef4444':'#6366f1'};border-radius:4px 4px 0 0"></div>
          </div>
          <div style="font-size:11px;color:#64748b">${m.mes}</div>
        </div>`
      }).join('')}
    </div>
    <div style="display:flex;gap:14px;margin-top:10px">
      <span><span class="leg-dot" style="background:#c7d2fe"></span><span style="font-size:11px;color:#64748b">Proyectado</span></span>

    </button>
  </div>`

  const deptCards=DEPTS.map((d,di)=>{
    const lines=activeLines(d)
    const dp=lines.reduce((a,l)=>a+l[1],0)
    const de=lines.reduce((a,l)=>a+l[2],0)
    const dv=vPct(dp,de)
    const over=de>dp
    const execPct=dp>0?Math.min(Math.round(de/dp*100),200):0
    const isOpen=openDepts[di]
    const exoLines=d.lines.filter(l=>l[3])
    const hasExo=exoLines.length>0

    return`<div class="dept-card" style="border-left:4px solid ${d.color}">
      <div class="dept-hdr" onclick="toggleDept(${di})">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="dept-name">${d.name}</div>
            ${hasExo&&!showExo?`<span style="background:#fef3c7;color:#92400e;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px">Sin ${exoLines.map(l=>l[0]).join(', ')}</span>`:''}
            ${hasExo&&showExo?`<span style="background:#f0fdf4;color:#166534;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px">Incl. ${exoLines.map(l=>l[0]).join(', ')}</span>`:''}
          </div>
          <div class="dept-hint">${lines.length} líneas · ${isOpen?'Cerrar ▲':'Ver detalle ▼'}</div>
          <div class="progress-labels"><span>${fN(dp)} presup.</span><span style="color:${over?'#dc2626':'#16a34a'};font-weight:600">${execPct}% ejecutado</span><span>${fN(de)} ejec.</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${Math.min(execPct,100)}%;background:${over?'#ef4444':d.color}"></div></div>
        </div>
        <div class="dept-var" style="margin-left:14px;flex-shrink:0">
          <div class="dept-var-val" style="color:${over?'#dc2626':'#16a34a'}">${fP(dv)}</div>
          <div class="dept-var-sub">${over?'+':''}${fN(de-dp)}</div>
        </div>
      </div>
      ${isOpen?`<div>
        <table class="lines-table">
          <thead><tr>
            <th style="text-align:left">Línea</th>
            <th>Presup.</th><th>Ejec.</th><th>Var %</th><th style="text-align:center">Estado</th>
          </tr></thead>
          <tbody>
          ${lines.map(([name,p,e,isExo])=>{
            const v=vPct(p,e);const s=sem(v,true)
            return`<tr style="background:${SEM_BG[s]}">
              <td>${name}${isExo?` <span style="background:#fef9c3;color:#854d0e;font-size:10px;padding:1px 6px;border-radius:99px;margin-left:4px">exógena</span>`:''}</td>
              <td style="color:#64748b">${fN(p)}</td>
              <td style="font-weight:500">${fN(e)}</td>
              <td class="${e>p?'vn':'vp'}">${fP(v)}</td>
              <td style="text-align:center"><span class="sem" style="background:${SEM_COLOR[s]}"></span></td>
            </tr>`
          }).join('')}
          <tr class="lines-total">
            <td>Total ${d.name}</td>
            <td>${fN(dp)}</td><td>${fN(de)}</td>
            <td class="${over?'vn':'vp'}">${fP(dv)}</td>
            <td style="text-align:center"><span class="sem" style="background:${SEM_COLOR[sem(dv,true)]}"></span></td>
          </tr>
          </tbody>
        </table>
      </div>`:''}
    </div>`
  }).join('')

  return toggleHTML+deptCards
}

function buildPYG(){
  const exec=[{k:'enero',l:'Enero'},{k:'febrero',l:'Febrero'},{k:'marzo',l:'Marzo'}]
  const proj=[{k:'abril',l:'Abril'},{k:'mayo',l:'Mayo'},{k:'junio',l:'Junio'},{k:'julio',l:'Julio'},{k:'agosto',l:'Agosto'},{k:'septiembre',l:'Sep.'},{k:'octubre',l:'Oct.'},{k:'noviembre',l:'Nov.'},{k:'diciembre',l:'Dic.'}]
  const rowStyle=(row)=>{
    if(row.total)return'font-weight:700;font-size:13px;background:#eef2ff;border-top:2px solid #6366f1;'
    if(row.sub)return'font-weight:600;font-size:12px;background:#f8fafc;border-top:.5px solid #cbd5e1;'
    return'font-size:11px;background:#fff;'
  }
  const thBase='padding:8px 10px;text-align:right;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#fff;white-space:nowrap;border-right:.5px solid rgba(255,255,255,.15)'
  const thLeft=`${thBase};text-align:left;position:sticky;left:0;z-index:3;min-width:170px`
  const execHeader=exec.map(m=>`<th colspan="4" style="${thBase};text-align:center;background:#4338ca;border-left:2px solid rgba(255,255,255,.3)">${m.l} — Ejecutado</th>`).join('')
  const projHeader=proj.map(m=>`<th colspan="2" style="${thBase};text-align:center;background:#64748b;border-left:2px solid rgba(255,255,255,.3)">${m.l} — Proyección</th>`).join('')
  const subExec=exec.map(m=>`<th style="${thBase};background:#5145cd;border-left:2px solid rgba(255,255,255,.2)">Proy.</th><th style="${thBase};background:#5145cd">Real</th><th style="${thBase};background:#5145cd">% Var</th><th style="${thBase};background:#3b82f6">% s/Vta</th>`).join('')
  const subProj=proj.map(m=>`<th style="${thBase};background:#475569;border-left:2px solid rgba(255,255,255,.2)">Proy.</th><th style="${thBase};background:#3b82f6">% s/Vta</th>`).join('')
  const tdStyle='padding:7px 10px;text-align:right;border-bottom:.5px solid #f1f5f9;border-right:.5px solid #f1f5f9;white-space:nowrap'
  const tdLeft='padding:7px 10px;text-align:left;border-bottom:.5px solid #f1f5f9;position:sticky;left:0;z-index:1;white-space:nowrap'
  const dataRows=PL_ROWS.map(row=>{
    const rs=rowStyle(row)
    const tdL=`${tdLeft};${rs};min-width:170px`
    const indent=!row.sub&&!row.total?'padding-left:18px;color:#64748b;':''
    const execCells=exec.map(m=>{
      const d=PLD[m.k],v=d[row.k],ti=d.total_ing
      const vp=vPct(v.p,v.r)
      const good=row.inc?v.r>=v.p:v.r<=v.p
      const vc=good?'#16a34a':'#dc2626'
      const base=ti.r||ti.p
      return`<td style="${tdStyle};${rs};border-left:2px solid #e0e7ff">${fN(v.p)}</td><td style="${tdStyle};${rs};font-weight:${row.sub||row.total?600:400}">${fN(v.r)}</td><td style="${tdStyle};${rs};color:${vc};font-weight:600">${fP(vp)}</td><td style="${tdStyle};${rs};background:#eff6ff;color:#2563eb;font-weight:600">${pct(v.r||v.p,base)}</td>`
    }).join('')
    const projCells=proj.map(m=>{
      const d=PLD[m.k],v=d[row.k],ti=d.total_ing
      return`<td style="${tdStyle};${rs};color:#94a3b8;border-left:2px solid #e2e8f0">${fN(v.p)}</td><td style="${tdStyle};${rs};background:#eff6ff;color:#2563eb;font-weight:600">${pct(v.p,ti.p)}</td>`
    }).join('')
    return`<tr><td style="${tdL};${indent}">${row.l}</td>${execCells}${projCells}</tr>`
  }).join('')
  return`
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <span class="badge" style="background:#eef2ff;color:#4338ca">Ejecutado: Ene – Mar</span>
    <span class="badge" style="background:#f1f5f9;color:#64748b">Proyección: Abr – Dic</span>
    <span class="badge" style="background:#eff6ff;color:#2563eb">% s/Vta = fila ÷ total ingresos</span>
  </div>
  <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:.5px solid #e2e8f0">
    <table style="border-collapse:collapse;min-width:100%">
      <thead>
        <tr><th style="${thLeft};background:#1e293b">Concepto</th>${execHeader}${projHeader}</tr>
        <tr><th style="${thLeft};background:#334155;font-size:10px;color:#94a3b8;font-weight:400;letter-spacing:0"></th>${subExec}${subProj}</tr>
      </thead>
      <tbody>${dataRows}</tbody>
    </table>
  </div>`
}

window.toggleExo=function(){
  window.showExo=window.showExo===false?true:false
  render()
}
window.toggleDept=function(di){
  openDepts[di]=!openDepts[di]
  document.getElementById('panel-areas').innerHTML=buildAreas()
}
window.switchTab=function(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id))
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id))
}

function render(){
  const tp=totalP(),te=totalE(),tv=vPct(tp,te)
  document.getElementById('app').innerHTML=`
  <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">SALUS · Informe presupuestal</div>
  <h1>Marzo 2025</h1>
  <div class="sub">Presupuesto vs. Ejecutado · Estado de resultados Ene–Dic</div>
  <div class="kpis">
    <div class="kpi kpi-p"><div class="kpi-label">Total presupuestado</div><div class="kpi-val">${fN(tp)}</div><div class="kpi-sub">COP</div></div>
    <div class="kpi kpi-e"><div class="kpi-label">Total ejecutado</div><div class="kpi-val">${fN(te)}</div><div class="kpi-sub">COP</div></div>
    <div class="kpi kpi-v"><div class="kpi-label">Variación global</div><div class="kpi-val">${fP(tv)}</div><div class="kpi-sub">${te>tp?'+':''}${fN(te-tp)} COP</div></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="resumen" onclick="switchTab('resumen')">Resumen</button>
    <button class="tab" data-tab="areas" onclick="switchTab('areas')">Áreas</button>
    <button class="tab" data-tab="pyg" onclick="switchTab('pyg')">P&G</button>
  </div>
  <div class="panel active" id="panel-resumen">${buildResumen()}</div>
  <div class="panel" id="panel-areas">${buildAreas()}</div>
  <div class="panel" id="panel-pyg">${buildPYG()}</div>`
}
render()
</script>
</body>
</html>
